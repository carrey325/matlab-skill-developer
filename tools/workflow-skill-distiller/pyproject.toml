[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-skill-distiller"
version = "0.2.0"
description = "Evidence-first compiler for agent-neutral professional workflow skills."
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
where = ["src"]
